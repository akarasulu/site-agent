[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "site-agent"
version = "1.9.0"
description = "Generic, evidence-backed website interaction mapper and MCP generator."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "Alex O. Karasulu"}
]
keywords = ["mcp", "playwright", "automation", "crawler", "ansible", "ai-agents"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
  "Topic :: Software Development :: Code Generators",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
crawl = ["playwright>=1.49", "crawl4ai==0.8.9"]
dev = ["pytest>=8", "pytest-cov>=6.0", "build>=1.2", "twine>=5.0"]
release = ["build>=1.2", "twine>=5.0"]

[project.urls]
Homepage = "https://github.com/akarasulu/site-agent"
Repository = "https://github.com/akarasulu/site-agent"
Issues = "https://github.com/akarasulu/site-agent/issues"

[project.scripts]
site-agent = "site_agent.cli:main"

[tool.setuptools.packages.find]
include = ["site_agent*"]

[tool.coverage.run]
branch = true
source = ["site_agent"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
