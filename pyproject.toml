[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "site-agent"
version = "0.1.0"
description = "Generic, evidence-backed website interaction mapper and MCP generator."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
crawl = ["playwright>=1.44"]
dev = ["pytest>=8"]

[project.scripts]
site-agent = "site_agent.cli:main"

[tool.setuptools.packages.find]
include = ["site_agent*"]
