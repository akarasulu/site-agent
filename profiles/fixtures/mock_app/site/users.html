<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OpsBoard Users</title>
</head>
<body>
  <header>
    <h1>User Administration</h1>
    <nav>
      <a href="/dashboard.html">Dashboard</a>
      <a href="/settings.html">Settings</a>
      <a href="/reports.html">Reports</a>
      <a href="/items.html">Items</a>
    </nav>
  </header>
  <main>
    <section>
      <h2>Invite User</h2>
      <form action="/users.html" method="post" aria-label="Invite user">
        <label for="invite-email">User email</label>
        <input id="invite-email" name="user_email" type="email" required>
        <label for="role">Access role</label>
        <select id="role" name="role">
          <option>Viewer</option>
          <option>Operator</option>
          <option>Administrator</option>
        </select>
        <button type="submit">Send invite</button>
      </form>
    </section>
  </main>
</body>
</html>
